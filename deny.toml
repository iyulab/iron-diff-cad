# cargo-deny -- license gate for the Rust dependency graph.
#
# This crate is MIT and is meant to be linked by every consumer of the model,
# permissive and copyleft alike. What must NOT happen is a copyleft component
# arriving through a dependency, because a differ that carries a license
# obligation stops being the neutral evidence every consumer can share.
#
# Run locally: cargo deny check licenses sources

[licenses]
# Permissive only. Every entry below was observed in the current graph; this
# is not a speculative allowlist. A new license appearing here is a decision, not a
# line to append when a build fails.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
# Deliberately absent: MPL-2.0, EPL, CDDL and the LGPLs. They are weak
# copyleft, not permissive.

[bans]
multiple-versions = "warn"

[advisories]

[sources]
# crates.io only. A git or alternate-registry dependency would bypass the
# license review above, since its license field is whatever the source says.
unknown-registry = "deny"
unknown-git = "deny"
